[package]
name = "bioconductor-bioviz"
kind = "tool"
version = "3.23"
release = 2
license = "Apache-2.0"
main = "src/main.taf"

[meta]
domain = "bio"
categories = ["visualization", "bioconductor", "phylogenetics", "plotting", "R"]
keywords = ["Bioconductor", "R", "Rscript", "ggtree", "treeio", "ape", "ggplot2", "svglite", "ragg", "Newick", "phylogeny", "bioinformatics plots"]
description = "A TAFFISH-maintained R/Bioconductor 3.23 bioinformatics visualization runtime with a stable tree plotting helper CLI."

[repository]
url = "https://github.com/taffish/bioconductor-bioviz"

[command]
name = "taf-bioconductor-bioviz"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/bioconductor-bioviz:3.23-r2"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[upstream]
name = "Bioconductor bioinformatics visualization runtime"
type = "official"
homepage = "https://bioconductor.org/"
manual = "https://bioconductor.org/install/"
release_url = "https://www.bioconductor.org/news/bioc_3_23_release/"
downloads = "https://hub.docker.com/r/bioconductor/bioconductor_docker"
version = "3.23"
license = "Multiple open-source licenses across Bioconductor, CRAN, R, and system packages"
citation = "Bioconductor project; package-specific citations are available from citation(package)"
watch = "manual"

[smoke]
backend = "docker"
timeout = 900
exist = ["R", "Rscript", "bioviz-runtime-info", "bioviz-tree", "bash", "grep", "sed"]
test = ["Rscript --version 2>&1 | grep -F 'Rscript (R) version 4.6.0' >/dev/null && Rscript -e 'stopifnot(as.character(BiocManager::version()) == \"3.23\")' && bioviz-runtime-info | grep -F 'Bioconductor\t3.23' >/dev/null", "Rscript -e 'pkgs <- c(\"ape\",\"treeio\",\"ggtree\",\"tidytree\",\"ggplot2\",\"svglite\",\"ragg\",\"optparse\",\"jsonlite\",\"readr\",\"data.table\",\"ggrepel\",\"patchwork\",\"cowplot\",\"scales\",\"viridis\",\"RColorBrewer\"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if (length(missing)) stop(paste(\"missing\", paste(missing, collapse=\",\")))'", "bioviz-tree --version | grep -Fx 'bioviz-tree 0.2.0 (Bioconductor 3.23)' >/dev/null && bioviz-tree --help 2>&1 | grep -F 'Tree plotting helper for Newick phylogenies' >/dev/null", "tmp=/tmp/taf-bioviz-tree-rect-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; cd \"$tmp\"; printf '%s\n' '((seq1:0.1,seq2:0.2):0.3,(seq3:0.2,seq4:0.4):0.1);' > tree.nwk && printf '%b\n' 'sample\tgroup\tregion' 'seq1\tA\tleaf' 'seq2\tA\tleaf' 'seq3\tB\troot' 'seq4\tB\troot' > metadata.tsv && printf '%b\n' 'sequence_id\tlabel' 'seq1\tAlpha one with a long journal label' 'seq2\tAlpha two with a long journal label' 'seq3\tBeta one with a long journal label' 'seq4\tBeta two with a long journal label' > label-map.tsv && bioviz-tree --tree tree.nwk --metadata metadata.tsv --label-map label-map.tsv --color-by group --layout rectangular --formats pdf,png,svg --style journal --title Journal Style Smoke --outdir out && test -s out/tree.pdf && test -s out/tree.png && test -s out/tree.svg && test -s out/tree_plot_summary.tsv && test -s out/run.manifest.json && grep -F 'metadata_matched_tips' out/tree_plot_summary.tsv >/dev/null && grep -F 'style\tjournal' out/tree_plot_summary.tsv >/dev/null && grep -F 'scale_bar\tauto' out/tree_plot_summary.tsv >/dev/null && grep -F 'title\tJournal Style Smoke' out/tree_plot_summary.tsv >/dev/null && grep -F 'plot_width' out/tree_plot_summary.tsv >/dev/null && grep -F 'ggtree' out/versions.tsv >/dev/null && rm -rf \"$tmp\"", "tmp=/tmp/taf-bioviz-tree-circ-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; cd \"$tmp\"; printf '%s\n' '((a:0.1,b:0.2):0.3,(c:0.2,d:0.4):0.1);' > tree.nwk && bioviz-tree --tree tree.nwk --layout circular --formats png --hide-tip-labels --outdir out && test -s out/tree.png && grep -F 'layout\tcircular' out/tree_plot_summary.tsv >/dev/null && rm -rf \"$tmp\""]
